<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>游戏列表 - 阮清尚</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Font chữ phong cách Trung Hoa hiện đại -->
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700&family=ZCOOL+QingKeHuangYou:wght@400;700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Ma+Shan+Zheng&display=swap" rel="stylesheet">

    <style>
        body {
            font-family: 'Noto Sans SC', 'ZCOOL QingKeHuangYou', sans-serif;
            background: #0a0a0a;
            color: #ffefd5;
            overflow-x: hidden;
        }
        h1, h2 {
            font-family: 'Ma Shan Zheng', 'ZCOOL QingKeHuangYou', cursive;
            letter-spacing: 3px;
        }

        /* Nền động mây + hoa văn cổ */
        .bg-animated {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: radial-gradient(circle at 20% 80%, #330000 0%, #0a0000 50%, #000000 100%);
            z-index: -2;
        }
        .cloud {
            position: absolute;
            background: linear-gradient(90deg, rgba(255,50,50,0.1), transparent);
            border-radius: 50%;
            filter: blur(80px);
            animation: float 20s infinite linear;
        }
        .cloud1 { width: 600px; height: 300px; top: 10%; left: -200px; animation-duration: 35s; }
        .cloud2 { width: 800px; height: 400px; bottom: 10%; right: -300px; animation-duration: 45s; }

        @keyframes float {
            from { transform: translateX(-100px); }
            to { transform: translateX(calc(100vw + 300px)); }
        }

        /* Đèn lồng trang trí */
        .lantern {
            position: absolute;
            width: 80px;
            height: 100px;
            background: radial-gradient(#fff200, #ff6b00);
            border-radius: 50% 50% 50% 50% / 60% 60% 40% 40%;
            box-shadow: 0 0 30px #ff6b00, 0 0 60px #ffff00;
            animation: sway 6s infinite ease-in-out;
        }
        .lantern::before {
            content: '福';
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            font-family: 'Ma Shan Zheng';
            font-size: 36px;
            color: #c00;
        }
        .lantern1 { top: 10%; left: 5%; animation-delay: 0s; }
        .lantern2 { top: 15%; right: 8%; animation-delay: 2s; }

        @keyframes sway {
            0%, 100% { transform: translateY(0) rotate(5deg); }
            50% { transform: translateY(-20px) rotate(-5deg); }
        }

        /* Card phong cách ấn triện + kính mờ đỏ */
        .game-card {
            background: rgba(30, 0, 0, 0.6);
            border: 2px solid #8b0000;
            backdrop-filter: blur(12px);
            box-shadow: 0 0 20px rgba(255, 0, 0, 0.4);
            transition: all 0.4s ease;
            position: relative;
            overflow: hidden;
        }
        .game-card::before {
            content: '';
            position: absolute;
            top: -50%; left: -50%;
            width: 200%; height: 200%;
            background: repeating-linear-gradient(
                45deg,
                transparent,
                transparent 10px,
                rgba(139,0,0,0.1) 10px,
                rgba(139,0,0,0.1) 20px
            );
            opacity: 0;
            transition: opacity 0.4s;
        }
        .game-card:hover::before {
            opacity: 1;
        }
        .game-card:hover {
            transform: translateY(-12px) scale(1.03);
            border-color: #ffd700;
            box-shadow: 0 0 40px rgba(255, 215, 0, 0.6);
        }
        .game-card img {
            transition: transform 0.6s ease;
        }
        .game-card:hover img {
            transform: scale(1.15);
        }

        /* Nút chơi kiểu ấn triện đỏ */
        .play-btn {
            background: linear-gradient(135deg, #c00, #8b0000);
            color: #ffd700;
            font-weight: bold;
            letter-spacing: 3px;
            border: 2px solid #ffd700;
            position: relative;
            overflow: hidden;
            padding: 12px 30px !important;
            border-radius: 8px;
            box-shadow: 0 4px 15px rgba(200,0,0,0.6);
        }
        .play-btn::after {
            content: '玩';
            position: absolute;
            top: 50%; right: 12px;
            transform: translateY(-50%);
            font-family: 'Ma Shan Zheng';
            font-size: 24px;
            opacity: 0.7;
        }
        .play-btn:hover {
            background: linear-gradient(135deg, #ff1a1a, #c00);
            box-shadow: 0 8px 25px rgba(255,0,0,0.8);
            transform: translateY(-3px);
            color: #fff;
        }

        /* Header phong cách cung điện */
        header {
            background: linear-gradient(to bottom, #1a0000, transparent);
            border-bottom: 3px double #ffd700;
            backdrop-filter: blur(10px);
        }
        .title-gradient {
            background: linear-gradient(90deg, #ffd700, #ff6b00, #ffd700, #ff0000);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 0 20px rgba(255,215,0,0.5);
        }

        /* Music control kiểu trống cơm Trung Hoa */
        .music-control {
            background: #8b0000;
            border: 3px solid #ffd700;
            box-shadow: 0 0 30px rgba(255,215,0,0.5);
        }
        .music-control:hover {
            background: #ffd700;
            color: #c00;
        }

        /* Footer */
        footer {
            background: linear-gradient(to top, #1a0000, transparent);
            border-top: 3px double #ffd700;
        }
    </style>
</head>
<body class="relative">

    <main class="container mx-auto px-6 py-32">

                    <div class="text-center mt-auto">

                </div>
            </div>
            <!-- Thêm các game khác tương tự... -->
            
            <div class="game-card rounded-xl overflow-hidden flex flex-col h-full">
                <div class="relative overflow-hidden h-56">
                    <img src="hinhquayten.png" alt="随机轮盘" class="w-full h-full object-cover">
                </div>
                <div class="p-6 flex flex-col flex-grow bg-gradient-to-b from-black/50 to-transparent">
                    <h2 class="text-2xl font-bold text-yellow-400 text-center mb-3">随机转盘</h2>
                    <p class="text-gray-300 text-center text-sm mb-6 flex-grow">命运之轮，由你掌控！</p>
                    <div class="text-center mt-auto">
                        <a href="dua.html" class="play-btn inline-block text-lg font-bold">立即开玩</a>
                    </div>

            </div>
            <div class="game-card rounded-xl overflow-hidden flex flex-col h-full">
                <div class="relative overflow-hidden h-56">
                    <img src="hinhquayten.png" alt="随机轮盘" class="w-full h-full object-cover">
                </div>
                <div class="p-6 flex flex-col flex-grow bg-gradient-to-b from-black/50 to-transparent">
                    <h2 class="text-2xl font-bold text-yellow-400 text-center mb-3">随机转盘</h2>
                    <p class="text-gray-300 text-center text-sm mb-6 flex-grow">命运之轮，由你掌控！</p>
                    <div class="text-center mt-auto">
                        <a href="quayten.html" class="play-btn inline-block text-lg font-bold">立即开玩</a>
                    </div>
                </div>
            </div>

        </div>
    </main>
    <script>
        const music = document.getElementById('backgroundMusic');
        const btn = document.getElementById('musicControl');
        let playing = false;

        music.volume = 0.3;

        btn.addEventListener('click', () => {
            if (playing) {
                music.pause();
                btn.innerHTML = '<i class="fas fa-play"></i>';
            } else {
                music.play();
                btn.innerHTML = '<i class="fas fa-pause"></i>';
            }
            playing = !playing;
        });

        // Tự động phát (nếu trình duyệt cho phép)
        music.play().catch(() => {});
    </script>
